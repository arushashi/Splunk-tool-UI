server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy API calls to the backend Service (same namespace).
    # The browser only ever talks to this same-origin nginx, never to
    # Splunk or the backend directly.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Single-page app: let client-side routing/deep-link URLs resolve to index.html.
    location / {
        try_files $uri /index.html;
    }
}
