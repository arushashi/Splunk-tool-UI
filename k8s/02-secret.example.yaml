# Template only — do NOT apply this file as-is, and never commit real
# credentials to git. Create the actual secret with kubectl instead:
#
#   kubectl create secret generic splunk-credentials \
#     --namespace peadminns \
#     --from-literal=SPLUNK_USERNAME='svc-log-viewer' \
#     --from-literal=SPLUNK_PASSWORD='change-me'
#
# Or, if you use a GitOps secret manager (Sealed Secrets, External Secrets,
# Vault, etc.), point it at this structure instead of committing plaintext.
apiVersion: v1
kind: Secret
metadata:
  name: splunk-credentials
  namespace: peadminns
type: Opaque
stringData:
  SPLUNK_USERNAME: "REPLACE_ME"
  SPLUNK_PASSWORD: "REPLACE_ME"
